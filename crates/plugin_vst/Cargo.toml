[package]
name = "plugin_vst"
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["Gran Sabana Sonic Lab <contact@gransabana.audio>"]
repository = "https://github.com/davidcastilloc/tepui-vst"
description = "TEPUI // Gran Sabana Sonic Lab — VST3, CLAP, and Standalone Neural Chromatic Sampler"
default-run = "tepui_studio"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "tepui_studio"
path = "src/bin/tepui_studio.rs"

[[bin]]
name = "ai_sampler_app"
path = "src/main.rs"

[dependencies]
synth_core = { path = "../synth_core" }
ai_bridge = { path = "../ai_bridge" }
arc-swap = "1.9"
crossbeam-channel = "0.5"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs", "vst3", "standalone"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wry = "0.47"
raw_window_handle_06 = { package = "raw-window-handle", version = "0.6" }
cpal = "0.15"
midir = "0.11"

[dev-dependencies]
