[package]
name = "base_plugin_webview"
version = "1.22.0"
edition = "2021"
license = "MIT"
description = "Domain-agnostic serverless WebView host, isolated UDF profile resolver, Win32 subclassing, and typed IPC bus for audio plugins."

[dependencies]
base_plugin_core = { path = "../base_plugin_core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
raw_window_handle_06 = { package = "raw-window-handle", version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wry = "0.47"
