name: Sync Upstream Audio Plugin SDK

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Upstream SDK GitHub repository (owner/repo)"
        required: false
        default: "davidcastilloc/rust-webview-vst-template"
      upstream_branch:
        description: "Branch or tag to sync from"
        required: false
        default: "main"

jobs:
  sync-sdk:
    name: Pull Latest SDK Crates & UI Bridge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Fetch and Sync Core SDK Directories
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'davidcastilloc/rust-webview-vst-template' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
        run: |
          git remote add upstream-sdk "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream-sdk "${UPSTREAM_BRANCH}"
          git checkout "upstream-sdk/${UPSTREAM_BRANCH}" -- \
            crates/dsp_core \
            crates/base_plugin_core \
            crates/base_plugin_webview \
            crates/base_plugin_standalone \
            packages/base-plugin-ui \
            scripts/audit_plugin_architecture.ps1
          cargo update -w || true

      - name: Create Pull Request with SDK Improvements
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(sdk): sync latest dsp_core, base_plugin_core, and base_plugin_webview"
          title: "chore(sdk): sincronización automática con mejoras del SDK central"
          body: |
            Sincronización automática de los crates base del ecosistema (`dsp_core`, `base_plugin_core`, `base_plugin_webview`, `base_plugin_standalone` y `packages/base-plugin-ui`) desde el repositorio central.
          branch: chore/sync-upstream-audio-sdk
