name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  semantic-release:
    name: Semantic Release & Windows Binary Packaging
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for Semantic Release
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Tests Before Release
        run: cargo test --workspace

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes `
            -p semantic-release@24 `
            -p "@semantic-release/commit-analyzer@13" `
            -p "@semantic-release/release-notes-generator@14" `
            -p "@semantic-release/changelog@6" `
            -p "@semantic-release/exec@6" `
            -p "@semantic-release/git@10" `
            -p "@semantic-release/github@11" `
            -p conventional-changelog-conventionalcommits@8 `
            semantic-release

  release-macos:
    name: Package & Upload macOS Release Bundle
    needs: semantic-release
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build macOS Standalone & VST3/CLAP Bundles
        run: |
          cargo build --release -p plugin_vst --bins
          cargo run --package xtask -- bundle plugin_vst --release
          cp README.md LICENSE CHANGELOG.md target/bundled/
          cp target/release/tepui_studio target/bundled/
          cd target/bundled
          zip -r TEPUI-macOS-Universal.zip TEPUI.vst3 TEPUI.clap tepui_studio README.md LICENSE CHANGELOG.md

      - name: Upload macOS Archive to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" "target/bundled/TEPUI-macOS-Universal.zip#TEPUI-macOS-Universal.zip (macOS VST3 + CLAP + Standalone)" --clobber

  release-linux:
    name: Package & Upload Linux x64 Release Bundle
    needs: semantic-release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Linux Audio, X11 & WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxft-dev \
            libxi-dev \
            libxinerama-dev \
            libxmu-dev \
            libxrandr-dev \
            libxrender-dev \
            libxpresent-dev \
            libxss-dev \
            libxt-dev \
            libxtst-dev \
            libxxf86vm-dev \
            pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Linux Standalone & VST3/CLAP Bundles
        run: |
          cargo build --release -p plugin_vst --bins
          cargo run --package xtask -- bundle plugin_vst --release
          cp README.md LICENSE CHANGELOG.md target/bundled/
          cp target/release/tepui_studio target/bundled/
          cd target/bundled
          tar -czf TEPUI-Linux-x64.tar.gz TEPUI.vst3 TEPUI.clap tepui_studio README.md LICENSE CHANGELOG.md

      - name: Upload Linux Archive to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" "target/bundled/TEPUI-Linux-x64.tar.gz#TEPUI-Linux-x64.tar.gz (Linux x64 VST3 + CLAP + Standalone)" --clobber
