[workspace]
members = [
    "crates/synth_core",
    "crates/ai_bridge",
    "crates/plugin_vst",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT"
authors = ["Gran Sabana Sonic Lab <contact@gransabana.audio>"]
repository = "https://github.com/davidcastilloc/tepui-vst"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
